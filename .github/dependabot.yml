version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # 2.23.x breaks dexing below Android API 26 (ZEN-2226).
      - dependency-name: "com.fasterxml.jackson.*"
        versions: ["2.23.*"]

  - package-ecosystem: "gradle"
    directory: "/examples/android-app"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
